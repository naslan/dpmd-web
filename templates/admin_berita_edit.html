{% extends "base.html" %}
{% block title %}Ubah berita{% endblock %}
{% block content %}
<section class="bagian wrap" style="padding-top:32px;max-width:820px">
  <p class="kecil"><a href="{{ url_for('admin', tab='berita') }}">Panel admin</a> / Ubah berita</p>
  <form class="panel baris" method="post" action="{{ url_for('edit_berita', i=b.id) }}" enctype="multipart/form-data">
    <h2>Ubah berita</h2>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="baris baris-2">
      <div><label for="judul">Judul berita</label><input id="judul" name="judul" required maxlength="200" value="{{ request.form.get('judul', b.judul) }}"></div>
      <div><label for="tanggal">Tanggal</label><input id="tanggal" name="tanggal" type="date" value="{{ request.form.get('tanggal', b.tanggal) }}"></div>
    </div>
    <div><label for="isi">Isi berita</label>
      <textarea id="isi" name="isi" required style="min-height:260px">{{ request.form.get('isi', b.isi) }}</textarea>
      <p class="bantu">Pisahkan paragraf dengan satu baris kosong.</p></div>
    {% if b.gambar %}
    <div><label>Gambar saat ini</label>
      <img src="{{ url_for('media', nama=b.gambar) }}" alt="" style="max-width:280px;border-radius:6px;border:1px solid var(--garis)">
      <label class="cek" style="margin-top:8px"><input type="checkbox" name="hapus_gambar" value="1"><span>Hapus gambar ini</span></label></div>
    {% endif %}
    <div><label for="gambar">{% if b.gambar %}Ganti gambar{% else %}Gambar (opsional){% endif %}</label>
      <input id="gambar" name="gambar" type="file" accept="image/jpeg,image/png,image/webp">
      <p class="bantu">JPG, PNG, atau WebP, maksimal 5 MB.</p></div>
    <div class="aksi" style="margin:0">
      <button class="btn btn-padi" type="submit">Simpan perubahan</button>
      <a class="btn btn-padi" href="{{ url_for('admin', tab='berita') }}" style="background:transparent;color:var(--padi);border-color:var(--padi)">Batal</a>
    </div>
  </form>
</section>
{% endblock %}
